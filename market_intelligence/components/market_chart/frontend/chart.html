<div id="toolbar">
  <div id="readout" aria-live="polite">
    <div id="readout-date">—</div>
    <div id="readout-value">—</div>
  </div>
  <div id="toolbar-actions">
    <div id="ranges" hidden>
      <button type="button" data-range="1M">1M</button>
      <button type="button" data-range="3M">3M</button>
      <button type="button" data-range="6M">6M</button>
      <button type="button" data-range="YTD">YTD</button>
      <button type="button" data-range="1Y">1Y</button>
      <button type="button" data-range="3Y">3Y</button>
    </div>
    <button id="reset" type="button">Full range</button>
  </div>
</div>
<div id="chart"></div>
