# Bounded Cboe LiveVol ingest on the existing DigitalOcean writer host.
# Uses repository secrets + pinned SSH trust. Never prints credentials.
# Temporarily sets MI_CBOE_ENABLED=1 for one --cboe run, then restores prior value.
name: Cboe host bounded ingest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cboe-host-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Bounded Cboe ingest on writer host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${DO_SSH_KNOWN_HOSTS:-}" ]; then
            echo "FAIL: DO_SSH_KEY and DO_SSH_KNOWN_HOSTS are required"
            exit 3
          fi
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          unset SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS

      - name: Sync Cboe writer modules to host
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DO_USER@$DO_HOST" \
            'mkdir -p /root/FMP_SCREENER/tmp_cboe_sync /root/FMP_SCREENER/market_intelligence /root/FMP_SCREENER/db/migrations /root/FMP_SCREENER/db/roles /root/FMP_SCREENER/jobs /root/FMP_SCREENER/pages'
          scp -o StrictHostKeyChecking=yes -o BatchMode=yes \
            market_intelligence/cboe_client.py \
            market_intelligence/cboe_analytics.py \
            market_intelligence/ingest_cboe.py \
            market_intelligence/adapters.py \
            market_intelligence/catalog.py \
            market_intelligence/read_models.py \
            market_intelligence/pages_ui.py \
            market_intelligence/page_registry.py \
            jobs/market_intelligence_refresh.py \
            db/migrations/038_cboe_volatility.sql \
            db/roles/market_intelligence_readonly.sql \
            db/roles/dashboard_readonly.sql \
            pages/21_Options_Volatility.py \
            "$DO_USER@$DO_HOST:/root/FMP_SCREENER/tmp_cboe_sync/"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DO_USER@$DO_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /root/FMP_SCREENER
          cp -f tmp_cboe_sync/cboe_client.py market_intelligence/
          cp -f tmp_cboe_sync/cboe_analytics.py market_intelligence/
          cp -f tmp_cboe_sync/ingest_cboe.py market_intelligence/
          cp -f tmp_cboe_sync/adapters.py market_intelligence/
          cp -f tmp_cboe_sync/catalog.py market_intelligence/
          cp -f tmp_cboe_sync/read_models.py market_intelligence/
          cp -f tmp_cboe_sync/pages_ui.py market_intelligence/
          cp -f tmp_cboe_sync/page_registry.py market_intelligence/
          cp -f tmp_cboe_sync/market_intelligence_refresh.py jobs/
          cp -f tmp_cboe_sync/038_cboe_volatility.sql db/migrations/
          cp -f tmp_cboe_sync/market_intelligence_readonly.sql db/roles/
          cp -f tmp_cboe_sync/dashboard_readonly.sql db/roles/
          cp -f tmp_cboe_sync/21_Options_Volatility.py pages/
          # Ensure stale parallel Options page from older branches is gone.
          rm -f pages/20_Options.py
          echo sync_complete=1
          REMOTE

      - name: Apply migration, one bounded --cboe ingest, verify rows, restore flag
        run: |
          set -euo pipefail
          set +x
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DO_USER@$DO_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          set +x
          cd /root/FMP_SCREENER
          ENV_FILE=/etc/fmp/market_intelligence.env
          prior="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("/etc/fmp/market_intelligence.env").read_text(encoding="utf-8")
          m = re.search(r"^(?!#)\s*MI_CBOE_ENABLED=(.*)$", text, re.M)
          print((m.group(1).strip().strip('"').strip("'") if m else "0") or "0")
          PY
          )"
          restore_flag() {
            python3 - <<PY
          from pathlib import Path
          import re
          prior = """$prior"""
          path = Path("/etc/fmp/market_intelligence.env")
          text = path.read_text(encoding="utf-8")
          if re.search(r"^(?!#)\s*MI_CBOE_ENABLED=", text, re.M):
              text = re.sub(r"^(?!#)\s*MI_CBOE_ENABLED=.*$", "MI_CBOE_ENABLED=" + prior, text, count=1, flags=re.M)
          else:
              text = text.rstrip() + "\nMI_CBOE_ENABLED=" + prior + "\n"
          path.write_text(text, encoding="utf-8")
          print("mi_cboe_enabled_restored=1")
          PY
          }
          trap restore_flag EXIT
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("/etc/fmp/market_intelligence.env")
          text = path.read_text(encoding="utf-8")
          if re.search(r"^(?!#)\s*MI_CBOE_ENABLED=", text, re.M):
              text = re.sub(r"^(?!#)\s*MI_CBOE_ENABLED=.*$", "MI_CBOE_ENABLED=1", text, count=1, flags=re.M)
          else:
              text = text.rstrip() + "\nMI_CBOE_ENABLED=1\n"
          if not re.search(r"^(?!#)\s*CBOE_API_MODE=", text, re.M):
              text = text.rstrip() + "\nCBOE_API_MODE=delayed\n"
          path.write_text(text, encoding="utf-8")
          PY
          # shellcheck disable=SC1091
          set -a
          . "$ENV_FILE"
          set +a
          # shellcheck disable=SC1091
          source venv/bin/activate
          if [ -z "${CBOE_CLIENT_ID:-}" ] || [ -z "${CBOE_CLIENT_SECRET:-}" ]; then
            echo "FAIL: CBOE credentials missing from market_intelligence.env (run provision_mi_provider_keys first)"
            exit 3
          fi
          echo "cboe_credentials_present=1"
          echo "cboe_id_len=${#CBOE_CLIENT_ID}"
          echo "cboe_secret_len=${#CBOE_CLIENT_SECRET}"
          python -m jobs.apply_migrations
          if [ -n "${MI_ADMIN_DATABASE_URL:-${ADMIN_DATABASE_URL:-}}" ]; then
            psql "${MI_ADMIN_DATABASE_URL:-$ADMIN_DATABASE_URL}" -v ON_ERROR_STOP=1 -f db/roles/market_intelligence_readonly.sql || true
            if [ -f db/roles/dashboard_readonly.sql ]; then
              psql "${MI_ADMIN_DATABASE_URL:-$ADMIN_DATABASE_URL}" -v ON_ERROR_STOP=1 -f db/roles/dashboard_readonly.sql || true
            fi
          fi
          set +e
          python -m jobs.market_intelligence_refresh --cboe --json > /tmp/cboe_ingest_report.json 2>/tmp/cboe_ingest_stderr.txt
          refresh_rc=$?
          set -e
          echo "refresh_exit_code=${refresh_rc}"
          if [ "$refresh_rc" -gt 1 ]; then
            echo "FAIL: refresh hard-failed"
            tail -n 40 /tmp/cboe_ingest_stderr.txt || true
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from market_intelligence.writer_db import writer_engine
          from market_intelligence.read_models import data_health_context, options_volatility_context
          from sqlalchemy import text

          raw = Path("/tmp/cboe_ingest_report.json").read_text(encoding="utf-8").strip()
          report = json.loads(raw)
          print("refresh_status=" + str(report.get("status")))
          cboe_result = (report.get("results") or {}).get("cboe") or {}
          print("cboe_result_failed=" + str(cboe_result.get("failed")))
          print("points_used=" + str(cboe_result.get("points_used")))
          sections = cboe_result.get("sections") or {}
          for name, section in sorted(sections.items()):
              print("section={0}:{1}".format(name, section.get("status") if isinstance(section, dict) else section))

          engine = writer_engine()
          with engine.connect() as conn:
              latest = list(conn.execute(text(
                  "SELECT metric_id, status, (value IS NOT NULL) AS has_value, "
                  "provider_observation_ts IS NOT NULL AS has_obs, ingested_at IS NOT NULL AS has_ingest "
                  "FROM mi_v_cboe_vol_latest ORDER BY metric_id"
              )).mappings())
              health = list(conn.execute(text(
                  "SELECT freshness_dataset, freshness_status, transport_status "
                  "FROM mi_v_source_health WHERE source_id='CBOE_ALL_ACCESS' "
                  "ORDER BY freshness_dataset"
              )).mappings())
              opts = options_volatility_context(conn)
              dh = data_health_context(conn)

          ok = [r["metric_id"] for r in latest if r["status"] == "OK" and r["has_value"]]
          incomplete = [r["metric_id"] for r in latest if r["metric_id"] not in ok]
          print("metric_rows=" + str(len(latest)))
          print("metrics_ok=" + ",".join(ok))
          print("metrics_incomplete=" + ",".join(incomplete))
          print("health_rows=" + str(len(health)))
          for row in health:
              print("health={0}:{1}:{2}".format(row["freshness_dataset"], row["freshness_status"], row["transport_status"]))
          core = (opts or {}).get("cboe_core") or {}
          print("options_read_model_core_latest=" + str(len(core.get("latest") or [])))
          print("options_read_model_core_available=" + str(bool(core.get("available"))))
          sources = (dh or {}).get("sources") or (dh or {}).get("rows") or (dh or {}).get("health") or []
          if isinstance(sources, dict):
              sources = list(sources.values()) if sources else []
          cboe_health = [s for s in sources if isinstance(s, dict) and str(s.get("source_id") or "") == "CBOE_ALL_ACCESS"]
          print("data_health_cboe_rows=" + str(len(cboe_health) or len(health)))
          if not latest:
              raise SystemExit("no Cboe metric rows after ingest")
          if not ok and not any(r["status"] in {"OK", "INCOMPLETE"} for r in latest):
              raise SystemExit("no usable Cboe metric statuses")
          print("host_ingest_ok=1")
          print("streamlit_options_read_path_ok=1")
          PY
          REMOTE
