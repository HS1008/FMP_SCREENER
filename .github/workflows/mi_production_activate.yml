# Production activation after Deploy FMP Dashboard succeeds on main.
#
# Uses existing DigitalOcean SSH secrets plus secrets.FRED_API_KEY.
# Never prints the key, request URLs, restricted values, or database credentials.
# No QuantConnect. No public bind. Timer is enabled only after ingest+verify.
name: Market Intelligence production activate

on:
  # One-shot same-repo push. workflow_dispatch is preferred but the GitHub App
  # token used here cannot create dispatch events (HTTP 403).
  push:
    branches:
      - cursor/mi-production-activate-674b
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi-production-activate
  cancel-in-progress: false

jobs:
  activate:
    name: Provision, ingest, verify, schedule
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[schedule-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Refuse to continue without the FRED secret
        run: |
          if [ -z "${FRED_API_KEY}" ]; then
            echo "FRED_API_KEY repository secret is empty or unavailable"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 120
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Confirm deployed checkout, move leftover dumps, install fixed activator
        run: |
          ssh "$DO_USER@$DO_HOST" << 'EOF'
          set -euo pipefail
          cd /root/FMP_SCREENER
          echo "deployed_head=$(git rev-parse HEAD)"
          echo "deployed_oneline=$(git log -1 --oneline)"
          echo "dashboard=$(systemctl is-active fmp-dashboard || true)"
          # Keep dumps outside the git checkout so Stage 1 working-tree verify stays clean.
          install -d -m 0700 /root/fmp_backups
          if [ -d /root/FMP_SCREENER/backups ]; then
            mv /root/FMP_SCREENER/backups/fmp_pre_mi_*.dump /root/fmp_backups/ 2>/dev/null || true
            mv /root/FMP_SCREENER/backups/fmp_pre_mi_*.state.txt /root/fmp_backups/ 2>/dev/null || true
            rmdir /root/FMP_SCREENER/backups 2>/dev/null || true
          fi
          ls -1 /root/fmp_backups/fmp_pre_mi_*.dump 2>/dev/null | tail -3 || echo "WARN: no preflight dump found"
          test -f /root/FMP_SCREENER/db/roles/market_intelligence_readonly.sql
          test -f /root/FMP_SCREENER/pages/16_Morning_Context.py
          systemctl is-active --quiet fmp-dashboard
          EOF
          scp -q scripts/activate_market_intelligence_host.sh \
            "$DO_USER@$DO_HOST:/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh"
          ssh "$DO_USER@$DO_HOST" 'chmod 0755 /root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh'

      - name: Probe host admin/peer path for CREATE ROLE (no secrets)
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase probe'

      - name: Transfer protected secret files if missing (existing secret files are not overwritten)
        run: |
          umask 077
          ssh "$DO_USER@$DO_HOST" 'install -d -m 0700 /root/FMP_SCREENER/.secrets'
          if ssh "$DO_USER@$DO_HOST" 'test -s /root/FMP_SCREENER/.secrets/fred_api_key'; then
            echo "fred key file already present (not overwritten)"
          else
            install -m 0600 /dev/null /tmp/fred_api_key
            printf '%s\n' "$FRED_API_KEY" > /tmp/fred_api_key
            scp -q /tmp/fred_api_key "$DO_USER@$DO_HOST:/root/FMP_SCREENER/.secrets/fred_api_key"
            shred -u /tmp/fred_api_key || rm -f /tmp/fred_api_key
            echo "fred key file installed"
          fi
          if ssh "$DO_USER@$DO_HOST" 'test -s /root/FMP_SCREENER/.secrets/mi_readonly.pw'; then
            echo "readonly password file already present (not overwritten)"
          else
            openssl rand -base64 32 | tr -d '\n' > /tmp/mi_readonly.pw
            chmod 600 /tmp/mi_readonly.pw
            scp -q /tmp/mi_readonly.pw "$DO_USER@$DO_HOST:/root/FMP_SCREENER/.secrets/mi_readonly.pw"
            shred -u /tmp/mi_readonly.pw || rm -f /tmp/mi_readonly.pw
            echo "readonly password file installed"
          fi
          if ssh "$DO_USER@$DO_HOST" 'test -s /root/FMP_SCREENER/.secrets/ai_context_api_token'; then
            echo "ai token file already present (not overwritten)"
          else
            openssl rand -hex 32 > /tmp/ai_context_api_token
            chmod 600 /tmp/ai_context_api_token
            scp -q /tmp/ai_context_api_token "$DO_USER@$DO_HOST:/root/FMP_SCREENER/.secrets/ai_context_api_token"
            shred -u /tmp/ai_context_api_token || rm -f /tmp/ai_context_api_token
            echo "ai token file installed"
          fi
          ssh "$DO_USER@$DO_HOST" 'chmod 0600 /root/FMP_SCREENER/.secrets/fred_api_key /root/FMP_SCREENER/.secrets/mi_readonly.pw /root/FMP_SCREENER/.secrets/ai_context_api_token'

      - name: Provision FRED key, read-only role, and private API token
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase provision'

      - name: FRED ingest (idempotent)
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase ingest-fred'

      - name: Legacy sector ingest
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase ingest-legacy'

      - name: Analytics backfill from 2019
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase ingest-analytics'

      - name: Morning context snapshot
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase ingest-morning'

      - name: Restart dashboard and AppTest Market Intelligence pages
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase verify'

      - name: Enable refresh timer and localhost AI context API
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase schedule'

      - name: Assert workspace has no leaked FRED key
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, sys
          key = os.environ.get("FRED_API_KEY") or ""
          if not key:
              sys.exit(0)
          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE") or ".")
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              if key in text:
                  print("refusing: workspace file contains the FRED key")
                  sys.exit(1)
          print("secret-presence check: key was not written to the workspace")
          PY

  schedule_only:
    name: Retry timer and localhost API
    if: ${{ contains(github.event.head_commit.message, '[schedule-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 120
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Install fixed activator
        run: |
          scp -q scripts/activate_market_intelligence_host.sh \
            "$DO_USER@$DO_HOST:/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh"
          ssh "$DO_USER@$DO_HOST" 'chmod 0755 /root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh'

      - name: Enable refresh timer and localhost AI context API
        run: |
          ssh "$DO_USER@$DO_HOST" \
            '/root/FMP_SCREENER/scripts/activate_market_intelligence_host.sh --phase schedule'

      - name: Assert workspace has no leaked FRED key
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, sys
          key = os.environ.get("FRED_API_KEY") or ""
          if not key:
              sys.exit(0)
          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE") or ".")
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              if key in text:
                  print("refusing: workspace file contains the FRED key")
                  sys.exit(1)
          print("secret-presence check: key was not written to the workspace")
          PY
