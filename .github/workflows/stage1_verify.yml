# Stage 1 production verification.
#
# Triggers:
#   - automatically after Deploy FMP Dashboard succeeds on main
#   - optionally via workflow_dispatch (manual rerun)
#
# Uses the same GitHub Actions secrets as deploy.yml:
#   DO_HOST, DO_USER, DO_SSH_KEY
# Secrets are never printed.
#
# This workflow does NOT:
#   - merge or deploy code
#   - restart Streamlit
#   - install scripts/install_backtest_sync_cron.sh
#   - launch the 81-test Stage 1 suite
#   - run FINAL_HOLDOUT
#   - run 2023+ research experiments
#   - listen for its own completion (no recursion)
#
# Backtests-only sync waits on outputs/backtest_sync.flock (same lock as
# the one-minute cron). Live-only sync does not take that lock.
#
# Next automation layer (NOT implemented here):
#   Cursor → QuantConnect smoke test → this workflow
#   → full Stage 1 orchestrator → result sync → Strategy Monitor

name: Stage 1 Production Verification

on:
  workflow_run:
    workflows:
      - Deploy FMP Dashboard
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Report trigger
        run: |
          echo "STAGE 1 PRODUCTION VERIFICATION TRIGGER"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Trigger: manual workflow_dispatch"
          else
            echo "Trigger: automatic after Deploy FMP Dashboard"
            echo "Deploy workflow run ID: ${{ github.event.workflow_run.id }}"
            echo "Deploy conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "Deploy head SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "Deploy branch: ${{ github.event.workflow_run.head_branch }}"
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Stage 1 production
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" << 'EOF'
            set -euo pipefail

            if [ -d /opt/fmp/current ]; then
              if [ ! -f /opt/fmp/current/scripts/verify_stage1_production.py ]; then
                echo "FAIL: scripts/verify_stage1_production.py missing at /opt/fmp/current"
                echo "Merge this workflow to main and wait for the deploy job first."
                exit 1
              fi
              CODE_ROOT=/opt/fmp/current
            elif [ -d /root/FMP_SCREENER ] && [ -f /root/FMP_SCREENER/scripts/verify_stage1_production.py ]; then
              CODE_ROOT=/root/FMP_SCREENER
            else
              echo "FAIL: live code root missing on droplet"
              exit 1
            fi
            cd "$CODE_ROOT"
            echo "CODE_ROOT=$CODE_ROOT"

            if [ -f "$CODE_ROOT/venv/bin/activate" ]; then
              # shellcheck disable=SC1091
              source "$CODE_ROOT/venv/bin/activate"
            elif [ -f /root/FMP_SCREENER/venv/bin/activate ]; then
              # shellcheck disable=SC1091
              source /root/FMP_SCREENER/venv/bin/activate
            fi

            STAGE1_RC=1
            GIT_SHA=""
            trap 'python -m jobs.record_stage1_verify --git-sha "${GIT_SHA:-}" --code-root "${CODE_ROOT:-}" --rc "${STAGE1_RC:-1}" --out /var/lib/fmp/deploy/stage1_verify.json || true' EXIT

            python scripts/verify_stage1_production.py --working-tree-only

            GIT_SHA="$(git rev-parse HEAD)"
            echo "Git SHA: $GIT_SHA"
            git log -1 --oneline

            if ! systemctl is-active --quiet fmp-dashboard; then
              echo "FAIL: fmp-dashboard is not active"
              systemctl is-active fmp-dashboard || true
              exit 1
            fi

            python -c "import sqlalchemy, psycopg2; print('DB dependencies OK')"

            echo "Applying database migrations (idempotent)..."
            python -m jobs.apply_migrations

            echo "Syncing live/paper QuantConnect state (--live-only)..."
            echo "Live-only sync does not take the backtest-sync lock."
            python -m jobs.sync_quantconnect --live-only

            echo "Syncing existing QuantConnect backtests (--backtests-only)..."
            echo "This does not create new QuantConnect backtests."
            echo "Waiting up to 180s for outputs/backtest_sync.flock if the one-minute cron is running..."
            flock -w 180 /root/FMP_SCREENER/outputs/backtest_sync.flock -c "cd ${CODE_ROOT} && python -m jobs.sync_quantconnect --backtests-only"

            if [ ! -f /etc/fmp/fmp-dashboard.env ]; then
              echo "FAIL: /etc/fmp/fmp-dashboard.env is required for Stage 1 query-back"
              exit 1
            fi
            (
              set -a
              # shellcheck disable=SC1091
              source /etc/fmp/fmp-dashboard.env
              set +a
              unset DATABASE_URL DB_PASSWORD DB_USER DB_HOST DB_NAME DB_PORT MARKET_INTELLIGENCE_DATABASE_URL DASHBOARD_ALLOW_WRITER_FALLBACK
              python scripts/verify_stage1_production.py \
                --git-sha "$GIT_SHA" \
                --working-tree CLEAN \
                --streamlit ACTIVE \
                --migration PASS
            )
            STAGE1_RC=0
          EOF
