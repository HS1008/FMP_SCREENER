# Platform Research production acceptance.
#
# Triggers after Deploy FMP Dashboard succeeds on main, or via workflow_dispatch.
# Uses the same authorized DigitalOcean SSH secrets as deploy.yml.
# Secrets are never printed. Does not create QuantConnect jobs.
# Does not ingest or write PostgreSQL. Query-back and audit use
# /etc/fmp/fmp-dashboard.env only — never /root/FMP_SCREENER/.env.
#
# The official already-ingested TLTDurationMomentum V0 record is the
# production fixture. This is not a per-strategy workflow.

name: Platform Research Production Verification

on:
  workflow_run:
    workflows:
      - Deploy FMP Dashboard
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify official TLT record on Strategy Monitor
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" << 'EOF'
            set -euo pipefail
            if [ -d /opt/fmp/current ] && [ -f /opt/fmp/current/qc_research/verify_tlt_monitor.py ]; then
              CODE_ROOT=/opt/fmp/current
            elif [ -d /root/FMP_SCREENER ] && [ -f /root/FMP_SCREENER/qc_research/verify_tlt_monitor.py ]; then
              CODE_ROOT=/root/FMP_SCREENER
            else
              echo "FAIL: live code root missing on droplet"
              exit 1
            fi
            cd "$CODE_ROOT"
            if [ -f "$CODE_ROOT/venv/bin/activate" ]; then
              # shellcheck disable=SC1091
              source "$CODE_ROOT/venv/bin/activate"
            elif [ -f /root/FMP_SCREENER/venv/bin/activate ]; then
              # shellcheck disable=SC1091
              source /root/FMP_SCREENER/venv/bin/activate
            fi
            if [ ! -f /etc/fmp/fmp-dashboard.env ]; then
              echo "FAIL: /etc/fmp/fmp-dashboard.env is required for production verify"
              exit 1
            fi
            set -a
            # shellcheck disable=SC1091
            source /etc/fmp/fmp-dashboard.env
            set +a

            echo "PLATFORM RESEARCH PRODUCTION VERIFICATION"
            echo "CODE_ROOT=$CODE_ROOT"
            echo "Git SHA: $(git rev-parse HEAD)"
            git log -1 --oneline
            echo "This does not create QuantConnect jobs."
            echo "This does not ingest or write PostgreSQL."

            if ! systemctl is-active --quiet fmp-dashboard; then
              echo "FAIL: fmp-dashboard is not active"
              systemctl is-active fmp-dashboard || true
              exit 1
            fi

            python -m qc_research.ingest_platform_artifacts \
              --root qc_research/platform_artifacts/tlt_duration_momentum.json \
              --dry-run \
              --verify-monitor
            (
              set -a
              # shellcheck disable=SC1091
              source /etc/fmp/fmp-dashboard.env
              set +a
              unset DATABASE_URL DB_PASSWORD DB_USER DB_HOST DB_NAME DB_PORT MARKET_INTELLIGENCE_DATABASE_URL DASHBOARD_ALLOW_WRITER_FALLBACK
              export FMP_IDENTITY_ENV_ONLY=1
              export FMP_DASHBOARD_ENV=/etc/fmp/fmp-dashboard.env
              python -m qc_research.verify_tlt_monitor --live --code-root "$CODE_ROOT" --out /var/lib/fmp/deploy/tlt_v0_live.json
              python -m qc_research.verify_tlt_monitor --live --apptest --code-root "$CODE_ROOT"
              python -m qc_research.verify_csfml_v1 --live --code-root "$CODE_ROOT" --out /var/lib/fmp/deploy/csfml_v1_live.json
            )
          EOF

      - name: Audit live Streamlit identity and systemd path
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" << 'EOF'
            set -euo pipefail
            if [ -d /opt/fmp/current ] && [ -f /opt/fmp/current/qc_research/verify_tlt_monitor.py ]; then
              CODE_ROOT=/opt/fmp/current
            elif [ -d /root/FMP_SCREENER ] && [ -f /root/FMP_SCREENER/qc_research/verify_tlt_monitor.py ]; then
              CODE_ROOT=/root/FMP_SCREENER
            else
              echo "FAIL: live code root missing on droplet"
              exit 1
            fi
            cd "$CODE_ROOT"
            if [ -f "$CODE_ROOT/venv/bin/activate" ]; then
              # shellcheck disable=SC1091
              source "$CODE_ROOT/venv/bin/activate"
            elif [ -f /root/FMP_SCREENER/venv/bin/activate ]; then
              # shellcheck disable=SC1091
              source /root/FMP_SCREENER/venv/bin/activate
            fi
            if [ ! -f /etc/fmp/fmp-dashboard.env ]; then
              echo "FAIL: /etc/fmp/fmp-dashboard.env is required for production verify"
              exit 1
            fi
            set -a
            # shellcheck disable=SC1091
            source /etc/fmp/fmp-dashboard.env
            set +a
            unset DATABASE_URL DB_PASSWORD DB_USER DB_HOST DB_NAME DB_PORT MARKET_INTELLIGENCE_DATABASE_URL DASHBOARD_ALLOW_WRITER_FALLBACK
            echo "HOST DASHBOARD IDENTITY AUDIT"
            echo "This does not create QuantConnect jobs or change systemd."
            export FMP_IDENTITY_ENV_ONLY=1
            export FMP_DASHBOARD_ENV=/etc/fmp/fmp-dashboard.env
            verify_rc=0
            bash scripts/verify_dashboard_identity.sh || verify_rc=$?
            python -m jobs.audit_host_dashboard \
              --verify-rc "$verify_rc" \
              --out /var/lib/fmp/deploy/host_audit.json \
              --require-readonly \
              --env-file /etc/fmp/fmp-dashboard.env
          EOF
