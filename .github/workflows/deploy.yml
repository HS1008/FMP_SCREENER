name: Deploy FMP Dashboard

# MERGING TO MAIN IS A PRODUCTION DEPLOY EVENT.
# This workflow auto-deploys on push to main via SSH to DigitalOcean.
on:
  push:
    branches:
      - main

concurrency:
  group: fmp-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy orchestrator
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "FAIL: DO_SSH_KEY is required"
            exit 3
          fi
          if [ -z "${DO_SSH_KNOWN_HOSTS:-}" ]; then
            echo "FAIL: DO_SSH_KNOWN_HOSTS is required (pinned host key, not ssh-keyscan)"
            exit 3
          fi
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          unset SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          if [ -z "${DO_HOST:-}" ] || [ -z "${DO_USER:-}" ]; then
            echo "FAIL: DO_HOST and DO_USER are required"
            exit 3
          fi
          SHA="$(git rev-parse HEAD)"
          # Pipe this SHA's deploy_host.sh. The host script takes the flock.
          # Do not pull main on the host first: concurrent pushes must not
          # move the checkout to a different SHA before this script runs.
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DO_USER@$DO_HOST" \
            "bash -s -- --sha $SHA" \
            < scripts/deploy_host.sh
