name: Deploy FMP Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" << 'EOF'
            set -e

            cd /root/FMP_SCREENER

            echo "Fetching latest code..."
            git fetch origin main

            # Host-only edits of tracked files (e.g. an activator copied during
            # Market Intelligence rollout) must not block fast-forward.
            install -d -m 0700 /root/fmp_backups
            git diff --name-only -z | while IFS= read -r -d '' f; do
              if git diff --quiet HEAD origin/main -- "$f"; then
                continue
              fi
              echo "host_dirty_would_block=$f"
              cp "$f" "/root/fmp_backups/$(basename "$f").pre_pull"
              git checkout -- "$f"
            done

            echo "Updating server..."
            git pull --ff-only origin main

            echo "Activating virtual environment..."
            source venv/bin/activate

            if [ -f requirements.txt ]; then
              echo "Updating dependencies..."
              pip install -r requirements.txt
            fi

            echo "Applying database migrations..."
            python -m jobs.apply_migrations

            echo "Installing 1-minute backtest sync cron (idempotent, flock-protected)..."
            bash scripts/install_backtest_sync_cron.sh /root/FMP_SCREENER

            echo "Restarting Streamlit..."
            systemctl restart fmp-dashboard

            echo "Verifying Streamlit service..."
            systemctl is-active --quiet fmp-dashboard

            if systemctl cat fmp-ibkr-ingest.service >/dev/null 2>&1; then
              echo "Restarting private IBKR ingest API..."
              systemctl restart fmp-ibkr-ingest.service
            fi

            echo "Deployment complete."
          EOF
