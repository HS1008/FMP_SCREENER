name: Deploy FMP Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" << 'EOF'
            set -e

            cd /root/FMP_SCREENER

            echo "Fetching latest code..."
            git fetch origin main

            echo "Preserving host-modified activation scripts outside the checkout (not secrets)"
            preserve_dir=/root/fmp_backups/checkout_preserve
            install -d -m 0700 "$preserve_dir"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            for rel in scripts/activate_market_intelligence_host.sh scripts/materialize_ai_context_env.py scripts/install_market_intelligence_timers.sh; do
              if [ ! -e "$rel" ]; then
                continue
              fi
              tracked=0
              git ls-files --error-unmatch -- "$rel" >/dev/null 2>&1 && tracked=1
              dirty=0
              if [ "$tracked" = 1 ] && ! git diff --quiet -- "$rel"; then
                dirty=1
              fi
              if [ "$tracked" = 0 ]; then
                dirty=1
              fi
              if [ "$dirty" = 1 ]; then
                echo "preserving $rel -> $preserve_dir"
                cp -a "$rel" "$preserve_dir/$(basename "$rel").$stamp"
                if [ "$tracked" = 1 ]; then
                  git checkout -- "$rel"
                else
                  rm -f "$rel"
                fi
              fi
            done
            echo "working_tree_porcelain=$(git status --porcelain | tr '\n' '|')"

            echo "Updating server..."
            git pull --ff-only origin main

            echo "Activating virtual environment..."
            source venv/bin/activate

            if [ -f requirements.txt ]; then
              echo "Updating dependencies..."
              pip install -r requirements.txt
            fi

            echo "Verifying contract digests..."
            python -m qc_research.contracts.digests

            echo "Applying database migrations..."
            python -m jobs.apply_migrations

            echo "Provisioning dashboard_readonly (password file required)..."
            bash scripts/provision_dashboard_readonly.sh --require

            VERIFY_RC=0
            echo "Verifying Streamlit database identity..."
            bash scripts/verify_dashboard_identity.sh || VERIFY_RC=$?

            echo "Installing 1-minute backtest sync cron (idempotent, flock-protected)..."
            bash scripts/install_backtest_sync_cron.sh /root/FMP_SCREENER

            IMMUTABLE_RC=0
            if [ -d /opt/fmp/releases ]; then
              echo "Populating immutable release tree (systemd still uses /root/FMP_SCREENER)"
              if [ "${FMP_IMMUTABLE_RELEASE_STRICT:-}" = "1" ]; then
                bash scripts/deploy_release.sh --sha "$(git rev-parse HEAD)" --skip-restart \
                  || IMMUTABLE_RC=$?
              else
                bash scripts/deploy_release.sh --sha "$(git rev-parse HEAD)" --skip-restart --skip-preflight \
                  || IMMUTABLE_RC=$?
              fi
              if [ "$IMMUTABLE_RC" != "0" ]; then
                echo "immutable_release_layout=failed rc=${IMMUTABLE_RC}"
              fi
              if [ "${FMP_IMMUTABLE_RELEASE_STRICT:-}" = "1" ] && [ "$IMMUTABLE_RC" != "0" ]; then
                echo "immutable release populate failed and FMP_IMMUTABLE_RELEASE_STRICT=1"
                exit "$IMMUTABLE_RC"
              fi
              if [ "$IMMUTABLE_RC" = "0" ]; then
                if [ ! -f /opt/fmp/current/scripts/verify_dashboard_identity.sh ]; then
                  echo "immutable current is missing scripts/verify_dashboard_identity.sh"
                  exit 6
                fi
                echo "Verifying Streamlit identity from immutable release checkout..."
                IMMUTABLE_VERIFY_RC=0
                ( cd /opt/fmp/current && bash scripts/verify_dashboard_identity.sh ) || IMMUTABLE_VERIFY_RC=$?
                if [ "$IMMUTABLE_VERIFY_RC" != "0" ]; then
                  VERIFY_RC="$IMMUTABLE_VERIFY_RC"
                fi
              fi
            fi

            echo "Recording deploy identity (no secrets)..."
            python -m jobs.report_deploy_identity \
              --sha "$(git rev-parse HEAD)" \
              --checkout /root/FMP_SCREENER \
              --mode git_pull \
              --immutable-rc "$IMMUTABLE_RC" \
              --verify-rc "$VERIFY_RC"

            echo "Auditing host Streamlit identity (no secrets, no systemd change)..."
            set -a
            if [ -f /etc/fmp/fmp-dashboard.env ]; then
              # shellcheck disable=SC1091
              . /etc/fmp/fmp-dashboard.env
            fi
            set +a
            AUDIT_RC=0
            python -m jobs.audit_host_dashboard \
              --verify-rc "$VERIFY_RC" \
              --out /var/lib/fmp/deploy/host_audit.json \
              --require-readonly || AUDIT_RC=$?

            if [ "$VERIFY_RC" != "0" ]; then
              echo "dashboard identity verify failed rc=${VERIFY_RC}"
              exit "$VERIFY_RC"
            fi
            if [ "$AUDIT_RC" != "0" ]; then
              echo "host dashboard audit failed rc=${AUDIT_RC}"
              exit "$AUDIT_RC"
            fi

            echo "Recording systemd cutover readiness (dry-run, no unit change)..."
            CUTOVER_RC=0
            python -m jobs.cutover_dashboard_systemd \
              --verify-rc "$VERIFY_RC" \
              --env-file /etc/fmp/fmp-dashboard.env \
              --out /var/lib/fmp/deploy/cutover_readiness.json || CUTOVER_RC=$?
            if [ "$CUTOVER_RC" != "0" ]; then
              echo "systemd cutover readiness failed rc=${CUTOVER_RC}"
              exit "$CUTOVER_RC"
            fi

            echo "Restarting Streamlit..."
            systemctl restart fmp-dashboard

            echo "Verifying Streamlit service..."
            systemctl is-active --quiet fmp-dashboard

            if systemctl cat fmp-ibkr-ingest.service >/dev/null 2>&1; then
              echo "Restarting private IBKR ingest API..."
              systemctl restart fmp-ibkr-ingest.service
            fi

            echo "Deployment complete."
          EOF
