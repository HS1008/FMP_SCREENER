name: Ingest platform research artifacts

on:
  workflow_dispatch:
    inputs:
      root:
        description: Artifact directory or JSON file
        type: string
        default: qc_research/platform_artifacts
      dry_run:
        description: Validate only; do not write PostgreSQL
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest proven REAL_QC platform artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest or skip without inventing credentials
        run: |
          ARGS=(--root "${{ github.event.inputs.root }}" --verify-monitor)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m qc_research.ingest_platform_artifacts "${ARGS[@]}"
