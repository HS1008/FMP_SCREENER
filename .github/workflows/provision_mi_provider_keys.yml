name: Provision MI provider keys (not activation)

# Transfers EIA_API_KEY / OPENFIGI_API_KEY / SEC_USER_AGENT / CBOE_CLIENT_ID / CBOE_CLIENT_SECRET
# from repository secrets
# onto the existing DigitalOcean host through the pinned SSH trust path.
# Never enables ingestion, never restarts services, never prints values.
# Local Cursor cannot read GitHub secrets; this is the operator path when
# the only copies live in GitHub.

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: Replace existing non-placeholder keys (default preserve)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-mi-provider-keys
  cancel-in-progress: false

jobs:
  provision:
    name: Write protected key files and env placeholders only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "FAIL: DO_SSH_KEY is required"
            exit 3
          fi
          if [ -z "${DO_SSH_KNOWN_HOSTS:-}" ]; then
            echo "FAIL: DO_SSH_KNOWN_HOSTS is required (pinned host key, never a live host scan)"
            exit 3
          fi
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          unset SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS

      - name: Transfer keys and provision env (no restart, no ingest, no enablement)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CBOE_CLIENT_ID: ${{ secrets.CBOE_CLIENT_ID }}
          CBOE_CLIENT_SECRET: ${{ secrets.CBOE_CLIENT_SECRET }}
          ROTATE: ${{ github.event.inputs.rotate }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${DO_HOST:-}" ] || [ -z "${DO_USER:-}" ]; then
            echo "FAIL: DO_HOST and DO_USER are required"
            exit 3
          fi
          wrote=0
          if [ -n "${EIA_API_KEY:-}" ]; then
            printf '%s\n' "$EIA_API_KEY" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DO_USER@$DO_HOST" 'umask 077; mkdir -p /root/FMP_SCREENER/.secrets; cat > /root/FMP_SCREENER/.secrets/eia_api_key; chmod 600 /root/FMP_SCREENER/.secrets/eia_api_key'
            wrote=1
            echo "eia_secret_file=present"
          else
            echo "eia_secret_file=absent"
          fi
          if [ -n "${OPENFIGI_API_KEY:-}" ]; then
            printf '%s\n' "$OPENFIGI_API_KEY" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DO_USER@$DO_HOST" 'umask 077; mkdir -p /root/FMP_SCREENER/.secrets; cat > /root/FMP_SCREENER/.secrets/openfigi_api_key; chmod 600 /root/FMP_SCREENER/.secrets/openfigi_api_key'
            wrote=1
            echo "openfigi_secret_file=present"
          else
            echo "openfigi_secret_file=absent"
          fi
          if [ -n "${SEC_USER_AGENT:-}" ]; then
            printf '%s\n' "$SEC_USER_AGENT" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DO_USER@$DO_HOST" 'umask 077; mkdir -p /root/FMP_SCREENER/.secrets; cat > /root/FMP_SCREENER/.secrets/sec_user_agent; chmod 600 /root/FMP_SCREENER/.secrets/sec_user_agent'
            wrote=1
            echo "sec_ua_secret_file=present"
          else
            echo "sec_ua_secret_file=absent"
          fi
          if [ -n "${CBOE_CLIENT_ID:-}" ]; then
            printf '%s\n' "$CBOE_CLIENT_ID" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DO_USER@$DO_HOST" 'umask 077; mkdir -p /root/FMP_SCREENER/.secrets; cat > /root/FMP_SCREENER/.secrets/cboe_client_id; chmod 600 /root/FMP_SCREENER/.secrets/cboe_client_id'
            wrote=1
            echo "cboe_id_secret_file=present"
          else
            echo "cboe_id_secret_file=absent"
          fi
          if [ -n "${CBOE_CLIENT_SECRET:-}" ]; then
            printf '%s\n' "$CBOE_CLIENT_SECRET" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DO_USER@$DO_HOST" 'umask 077; mkdir -p /root/FMP_SCREENER/.secrets; cat > /root/FMP_SCREENER/.secrets/cboe_client_secret; chmod 600 /root/FMP_SCREENER/.secrets/cboe_client_secret'
            wrote=1
            echo "cboe_secret_secret_file=present"
          else
            echo "cboe_secret_secret_file=absent"
          fi
          if [ "$wrote" -eq 0 ]; then
            echo "FAIL: EIA_API_KEY, OPENFIGI_API_KEY, SEC_USER_AGENT, and CBOE credentials repository secrets are all empty"
            exit 3
          fi
          # Sync provisioner scripts so the host can accept Cboe key-file flags
          # before main is merged (host checkout may lag the workflow branch).
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DO_USER@$DO_HOST" \
            'mkdir -p /root/FMP_SCREENER/tmp_cboe_provision /root/FMP_SCREENER/scripts'
          scp -o StrictHostKeyChecking=yes -o BatchMode=yes \
            scripts/provision_digitalocean_mi_secrets.sh \
            scripts/protected_env.py \
            "$DO_USER@$DO_HOST:/root/FMP_SCREENER/tmp_cboe_provision/"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DO_USER@$DO_HOST" \
            'cp -f /root/FMP_SCREENER/tmp_cboe_provision/provision_digitalocean_mi_secrets.sh /root/FMP_SCREENER/scripts/ && \
             cp -f /root/FMP_SCREENER/tmp_cboe_provision/protected_env.py /root/FMP_SCREENER/scripts/ && \
             chmod 755 /root/FMP_SCREENER/scripts/provision_digitalocean_mi_secrets.sh'
          rotate_arg=""
          if [ "${ROTATE:-false}" = "true" ]; then
            rotate_arg="--rotate"
          fi
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DO_USER@$DO_HOST" \
            "ROTATE_ARG='$rotate_arg' bash -s" << 'REMOTE'
          set -euo pipefail
          set +x
          cd /root/FMP_SCREENER
          args=(--apply --env-file /etc/fmp/market_intelligence.env --root /root/FMP_SCREENER)
          if [ -n "${ROTATE_ARG:-}" ]; then
            args+=("$ROTATE_ARG")
          fi
          if [ -f /root/FMP_SCREENER/.secrets/eia_api_key ]; then
            args+=(--eia-key-file /root/FMP_SCREENER/.secrets/eia_api_key)
          fi
          if [ -f /root/FMP_SCREENER/.secrets/openfigi_api_key ]; then
            args+=(--openfigi-key-file /root/FMP_SCREENER/.secrets/openfigi_api_key)
          fi
          if [ -f /root/FMP_SCREENER/.secrets/sec_user_agent ]; then
            args+=(--sec-ua-file /root/FMP_SCREENER/.secrets/sec_user_agent)
          fi
          if [ -f /root/FMP_SCREENER/.secrets/cboe_client_id ]; then
            args+=(--cboe-id-file /root/FMP_SCREENER/.secrets/cboe_client_id)
          fi
          if [ -f /root/FMP_SCREENER/.secrets/cboe_client_secret ]; then
            args+=(--cboe-secret-file /root/FMP_SCREENER/.secrets/cboe_client_secret)
          fi
          bash scripts/provision_digitalocean_mi_secrets.sh "${args[@]}"
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("/etc/fmp/market_intelligence.env").read_text(encoding="utf-8")
          def present(key: str) -> bool:
              m = re.search(rf"^(?!#)\s*{re.escape(key)}=(.*)$", text, re.M)
              if not m:
                  return False
              raw = m.group(1).strip().strip('"').strip("'")
              return bool(raw) and raw.upper() not in {"CHANGE_ME", "CHANGEME", "PLACEHOLDER", "REPLACE_ME", "TODO", "YOUR_KEY_HERE", "XXX"}
          print("eia_env_configured=" + ("1" if present("EIA_API_KEY") else "0"))
          print("openfigi_env_configured=" + ("1" if present("OPENFIGI_API_KEY") else "0"))
          print("sec_ua_env_configured=" + ("1" if present("SEC_USER_AGENT") else "0"))
          print("cboe_env_configured=" + ("1" if present("CBOE_CLIENT_ID") and present("CBOE_CLIENT_SECRET") else "0"))
          PY
          echo provision_complete=1
          echo enablement_flags_unchanged=1
          echo services_not_restarted=1
          REMOTE
          unset EIA_API_KEY OPENFIGI_API_KEY SEC_USER_AGENT CBOE_CLIENT_ID CBOE_CLIENT_SECRET
