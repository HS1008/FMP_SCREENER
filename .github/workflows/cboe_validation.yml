# Manually triggered live Cboe LiveVol validation.
#
# Safety properties:
#   * Trigger is workflow_dispatch, plus same-repo push on this feature branch
#     (GitHub App tokens cannot dispatch). Not pull_request / schedule.
#   * Receives CBOE_CLIENT_ID / CBOE_CLIENT_SECRET explicitly. Never printed.
#   * Only database is a throw-away postgres:16 service. Production URLs refused.
#   * Point budget capped in the validation script. No deploy, no production mutation.
name: Cboe live validation (disposable PostgreSQL)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/cboe-volatility-v1
    paths:
      - ".github/workflows/cboe_validation.yml"
      - "jobs/validate_cboe_live.py"
      - "market_intelligence/cboe_client.py"
      - "market_intelligence/cboe_analytics.py"
      - "market_intelligence/ingest_cboe.py"
      - "db/migrations/038_cboe_volatility.sql"

permissions:
  contents: read

concurrency:
  group: cboe-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cboe-validation:
    name: Bounded live Cboe validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmp_test_admin
          POSTGRES_PASSWORD: fmp_test_only_not_a_secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmp_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CBOE_CLIENT_ID: ${{ secrets.CBOE_CLIENT_ID }}
      CBOE_CLIENT_SECRET: ${{ secrets.CBOE_CLIENT_SECRET }}
      FMP_TEST_DATABASE_URL: postgresql+psycopg2://fmp_test_admin:fmp_test_only_not_a_secret@127.0.0.1:5432/postgres
      DATABASE_URL: ""
      DATABASE_READONLY_URL: ""
      FMP_API_KEY: ""
      QC_API_TOKEN: ""
      QC_USER_ID: ""
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the validation module on this ref
        run: |
          if [ ! -f jobs/validate_cboe_live.py ]; then
            echo "jobs/validate_cboe_live.py is not on this ref."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Refuse to continue without Cboe secrets
        run: |
          if [ -z "${CBOE_CLIENT_ID}" ] || [ -z "${CBOE_CLIENT_SECRET}" ]; then
            echo "CBOE_CLIENT_ID / CBOE_CLIENT_SECRET repository secrets are empty or unavailable"
            exit 1
          fi

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for disposable PostgreSQL
        run: |
          python - <<'PY'
          import time
          from sqlalchemy import create_engine, text
          url = "postgresql+psycopg2://fmp_test_admin:fmp_test_only_not_a_secret@127.0.0.1:5432/postgres"
          engine = create_engine(url, future=True)
          for _ in range(30):
              try:
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  engine.dispose()
                  raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit("PostgreSQL service did not become ready")
          PY

      - name: Run bounded Cboe validation
        run: python -m jobs.validate_cboe_live --json --point-budget 40

      - name: Assert workspace does not contain secrets
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, sys
          secrets = [os.environ.get("CBOE_CLIENT_ID") or "", os.environ.get("CBOE_CLIENT_SECRET") or ""]
          secrets = [s for s in secrets if s]
          if not secrets:
              sys.exit(0)
          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE") or ".")
          print("secret-presence check: Cboe credentials configured and were not written to the workspace")
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for secret in secrets:
                  if secret in text:
                      print("refusing: workspace file contains a Cboe secret")
                      sys.exit(1)
          PY
